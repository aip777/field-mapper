[metadata]
name = field-mapper
version = 0.3.3
author = Ariful Islam Palash
author_email = ariful.islamk777@gmail.com
maintainer = Ariful Islam Palash, Md Lutfor Rahman
description = Field Mapper is a Python library for data validation and transformation with support for nested data extraction, custom validators, and flexible field mapping.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/aip777/field-mapper
project_urls =
    Homepage = https://github.com/aip777/field-mapper
    Documentation = https://github.com/aip777/field-mapper#readme
    Bug Tracker = https://github.com/aip777/field-mapper/issues
license = MIT
keywords =
    data-validation
    field-mapping
    data-transformation
    schema-validation
    nested-data
    api-validation
    form-validation
    third-party API data validation

[options]
package_dir =
    = .
packages = find:
python_requires = >=3.7
include_package_data = True
zip_safe = False

[options.packages.find]
where = .
exclude =
    tests*
    field_mapper.test*
    field_mapper.examples*

[bdist_wheel]
universal = 0
